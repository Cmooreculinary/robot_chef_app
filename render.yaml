# ============================================================
# Captain Culinary Kids — Render Blueprint
# ============================================================
# Two services: FastAPI backend + React static-site frontend.
# When you connect this repo to Render and click "Apply Blueprint",
# Render reads this file and provisions both services.
#
# Env vars marked `sync: false` MUST be entered manually in the
# Render dashboard (never committed to source control):
#   - MONGO_URL          (MongoDB Atlas connection string)
#   - EMERGENT_LLM_KEY   (your Emergent Universal Key)
# ============================================================

services:
  # ----------------------------------------------------------
  # Backend — FastAPI
  # ----------------------------------------------------------
  - type: web
    name: cck-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: cck_production
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: CORS_ORIGINS
        # Update this once the frontend URL is known. Comma-separated.
        value: https://robot-chef-app.onrender.com

  # ----------------------------------------------------------
  # Frontend — React static site
  # ----------------------------------------------------------
  - type: web
    name: robot-chef-app
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: yarn install --frozen-lockfile && yarn build
    staticPublishPath: build
    autoDeploy: true
    envVars:
      - key: REACT_APP_BACKEND_URL
        # Render fills this with the backend service URL automatically.
        fromService:
          type: web
          name: cck-backend
          property: host
    # Single-page-app rewrites: serve index.html for all unknown routes
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /illustrations/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
