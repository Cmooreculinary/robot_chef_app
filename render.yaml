services:
  - type: web
    name: cap-robot-chef
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # You set this manually in the Render dashboard — never committed
